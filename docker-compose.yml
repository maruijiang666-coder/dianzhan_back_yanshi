name: battery-swap

services:
  backend:
    build: ./backend
    container_name: battery-swap-backend
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://quant:quant-speed123@host.docker.internal:5432/huandian_v2
      - PORT=3001
      - TQ_API_URL=https://api1.tqdianbiao.com
      - TQ_AUTH_CODE=5ec0b6bf6f59984d97ec54f775a3c780
    volumes:
      - ./backend/app:/app/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: battery-swap-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
